name: dreamcatcher
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  objectbox: ^4.0.0
  objectbox_flutter_libs: ^4.0.0
  path: ^1.9.1
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^0.3.0
  objectbox_generator: ^4.0.0
  build_runner: any
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/background/background.jpg

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon_simplified.png"
  adaptive_icon_background: "#0A1128"
  adaptive_icon_foreground: "assets/images/app_icon_foreground_transparent.png"